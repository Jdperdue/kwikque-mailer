; Dedicated pool for the KwikQue/maillist app. Runs as ubuntu so .env can stay chmod 600
; and is unreadable to the other (www-data) sites on this VPS.
[maillist]
user = ubuntu
group = www-data
listen = /run/php/maillist-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.4-fpm-maillist.log
php_admin_flag[log_errors] = on
; CSV imports (about 40k rows is 2-3 MB); the app validates max 10 MB.
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 14M
